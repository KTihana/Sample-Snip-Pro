<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Sample Snip Pro</title>
    <link rel="stylesheet" href="studio.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <span class="brand"
          ><span class="brand-mark" aria-hidden="true"
            ><img src="icons/logo.svg" alt="" width="28" height="28" /></span
          ><span>Sample Snip <b>PRO</b></span></span
        >
        <button
          id="theme"
          class="icon-button"
          aria-label="Switch to light theme"
          title="Switch theme"
        >
          ☼
        </button>
      </header>
      <main>
        <button id="open-pads" class="primary-button" disabled>Open pads</button>
        <p id="popup-hint" class="source-hint">
          Capture this tab’s sound and play your saved pads.
        </p>
        <p id="popup-error" role="alert" hidden></p>
        <footer>Your sampler stays open beside the browser.</footer>
      </main>
    </div>
  </body>
</html>
